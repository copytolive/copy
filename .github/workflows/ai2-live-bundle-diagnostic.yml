name: AI2 Live Bundle Diagnostic
on:
  push:
    branches: [main]
    paths:
      - "ai2-live-bundle-diag-requests/**"
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai2-live-bundle-diag-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai2-live-bundle-diag-responses/$ID.json" >> "$GITHUB_OUTPUT"
      - name: Fetch current production root and inspect active bundles
        env:
          ID: ${{ steps.req.outputs.id }}
          OUT: ${{ steps.req.outputs.out }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai2-live-bundle-diag-responses /tmp/ai2live
          python3 - <<'PY'
          import urllib.request,re,hashlib,json,os,time,html
          rid=os.environ["ID"]; out=os.environ["OUT"]; base="https://copytolive.com"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 CopyToLive-AI2-Live-Diag","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=60) as r:return r.read()
          idx=get(base+"/index.html?ai2diag="+rid)
          txt=idx.decode("utf-8","replace")
          scripts=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)["\x27]',txt,re.I)
          local=[]
          for s in scripts:
              if s.startswith("/"): u=base+s
              elif s.startswith(base): u=s
              else: continue
              try:
                  b=get(u+("&" if "?" in u else "?")+"ai2diag="+rid)
                  st=b.decode("utf-8","replace")
                  rec={"src":s,"url":u,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()}
                  terms={}
                  for term in ["Hyperliquid","Renko","renkoActive","Signal Scan","Crypto","AI2RenkoShell"]:
                      positions=[m.start() for m in re.finditer(re.escape(term),st,re.I)]
                      terms[term]={"count":len(positions),"contexts":[st[max(0,p-1000):min(len(st),p+1800)] for p in positions[:8]]}
                  # Specific likely nav contexts, deduplicated and bounded
                  snippets=[]
                  for pat in [r'Hyperliquid',r'renkoActive',r'AI2RenkoShell',r'Signal Scan']:
                      for m in re.finditer(pat,st,re.I):
                          sn=st[max(0,m.start()-3000):min(len(st),m.start()+6000)]
                          if sn not in snippets: snippets.append(sn)
                          if len(snippets)>=24: break
                      if len(snippets)>=24: break
                  rec["terms"]=terms
                  rec["snippets"]=snippets
                  local.append(rec)
              except Exception as e:
                  local.append({"src":s,"url":u,"error":str(e)})
          doc={
            "id":rid,
            "index":{"bytes":len(idx),"sha256":hashlib.sha256(idx).hexdigest(),"scripts":scripts,
                     "containsHyperliquid":"Hyperliquid" in txt,"containsRenko":"Renko" in txt},
            "bundles":local
          }
          open(out,"w").write(json.dumps(doc,indent=2)+"\n")
          print(json.dumps({"index":doc["index"],"bundles":[{"src":x.get("src"),"sha256":x.get("sha256"),"terms":{k:v["count"] for k,v in x.get("terms",{}).items()}} for x in local]},indent=2))
          PY
      - name: Commit response
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"; test -s "$OUT"
          git config user.name "AI2 Live Bundle Diagnostic"
          git config user.email "ai2-live-bundle-diag@local.invalid"
          git add "$OUT"; git commit -m "ai2 live bundle diag: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$n"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1
