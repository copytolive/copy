name: AI2 Renko 502 Body Diagnostic
on:
  push:
    branches: [main]
    paths:
      - "ai2-renko-502-diag-requests/**"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai2-renko-502-diag-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai2-renko-502-diag-results/$ID.json" >> "$GITHUB_OUTPUT"
      - name: Capture upstream error bodies
        shell: bash
        env:
          ID: ${{ steps.req.outputs.id }}
          OUT: ${{ steps.req.outputs.out }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          python3 - "$OUT" "$ID" <<'PY'
          import json,sys,time,urllib.request,urllib.error
          out,aid=sys.argv[1:3]
          base="https://copytolive.com"
          urls=[
            "/api/charting/hyperliquid/renko/NEO?limit=400&smaPeriod=10&sma=10",
            "/api/charting/hyperliquid/renko/SOL?limit=400&smaPeriod=10&sma=10",
            "/api/charting/hyperliquid/indicator-catalog",
            "/api/charting/hyperliquid/renko-universe",
          ]
          rows=[]
          for u in urls:
            for n in range(1,4):
              t=time.time();status=0;body="";headers={}
              try:
                with urllib.request.urlopen(base+u,timeout=30) as r:
                  status=r.status; body=r.read(6000).decode("utf-8","replace"); headers=dict(r.headers.items())
              except urllib.error.HTTPError as e:
                status=e.code
                try: body=e.read(6000).decode("utf-8","replace")
                except Exception as x: body="READERR "+repr(x)
                headers=dict(e.headers.items()) if e.headers else {}
              except Exception as e:
                body=repr(e)
              rows.append({"url":u,"attempt":n,"status":status,"seconds":round(time.time()-t,3),"body":body[:6000],"server":headers.get("server"),"content_type":headers.get("content-type"),"retry_after":headers.get("retry-after")})
              if status==200: break
              time.sleep(n*1.5)
          open(out,"w").write(json.dumps({"id":aid,"rows":rows},indent=2)+"\n")
          PY
      - name: Commit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"; test -s "$OUT"
          git config user.name "AI2 Renko 502 Diagnostic"
          git config user.email "ai2-renko-502@local.invalid"
          git add "$OUT"; git commit -m "ai2 renko 502 diag: ${{ steps.req.outputs.id }}" || true
          git pull --rebase origin main
          git push origin HEAD:main
