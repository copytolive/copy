name: AI2 Renko Nav Staging Syntax
on:
  push:
    branches: [main]
    paths:
      - "ai2-staging/ai3_public_shell_v1.navfix.js"
      - ".github/workflows/ai2-renko-nav-staging-syntax.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Node syntax check
        run: node --check ai2-staging/ai3_public_shell_v1.navfix.js
