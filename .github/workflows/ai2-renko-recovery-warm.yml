name: AI2 Renko Recovery Warm
on:
  push:
    branches: [main]
    paths:
      - "ai2-renko-recovery-requests/**"
permissions:
  contents: write
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai2-renko-recovery-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "out=ai2-renko-recovery-responses/$ID.json" >> "$GITHUB_OUTPUT"
      - name: Gentle sequential cache recovery probe
        env:
          ID: ${{ steps.req.outputs.id }}
          FILE: ${{ steps.req.outputs.file }}
          OUT: ${{ steps.req.outputs.out }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai2-renko-recovery-responses
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse
          rid=os.environ["ID"]; out=os.environ["OUT"]; req=json.load(open(os.environ["FILE"]))
          base="https://copytolive.com/api/charting/hyperliquid"
          syms=req.get("symbols") or []
          def call(url,timeout=45):
              q=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 CopyToLive-AI2-Recovery","Cache-Control":"no-cache"})
              t=time.time()
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:
                      raw=r.read(8_000_000).decode("utf-8","replace")
                      try:d=json.loads(raw)
                      except:d={}
                      return {"status":getattr(r,"status",200),"seconds":round(time.time()-t,3),"body":d}
              except urllib.error.HTTPError as e:
                  try:d=json.loads(e.read().decode("utf-8","replace"))
                  except:d={}
                  return {"status":e.code,"seconds":round(time.time()-t,3),"body":d,"error":str(e)}
              except Exception as e:
                  return {"status":0,"seconds":round(time.time()-t,3),"body":{},"error":str(e)}
          results={}
          for sym in syms:
              attempts=[]
              for n,delay in enumerate([0,1,2,3,5,8],1):
                  if delay: time.sleep(delay)
                  u=f"{base}/renko/{urllib.parse.quote(str(sym),safe='')}?limit=400&smaPeriod=10&sma=10&ai2warm={rid}-{n}"
                  x=call(u,60)
                  x["n"]=n; x["returned"]=len((x.get("body") or {}).get("candles") or [])
                  attempts.append({k:v for k,v in x.items() if k!="body"})
                  if x["status"]==200 and x["returned"]>0: break
              results[sym]={"ok":attempts[-1]["status"]==200 and attempts[-1]["returned"]>0,"attempts":attempts}
          endpoints={}
          for name,path in {
              "universe":"/renko-universe",
              "indicator":"/indicator-catalog",
              "sol":"/renko/SOL?limit=400&smaPeriod=10&sma=10",
              "stream":"/stream/SOL"
          }.items():
              a=[]
              for n in range(1,4):
                  x=call(base+path,60); a.append({"n":n,"status":x["status"],"seconds":x["seconds"],"error":x.get("error","")})
                  if x["status"]==200: break
                  time.sleep(n)
              endpoints[name]=a
          failed=[s for s,v in results.items() if not v["ok"]]
          doc={"id":rid,"ok":not failed and all(v[-1]["status"]==200 for v in endpoints.values()),"symbols":results,"failed":failed,"endpoints":endpoints}
          json.dump(doc,open(out,"w"),indent=2)
          print(json.dumps({"id":rid,"ok":doc["ok"],"failed":failed,"endpoints":{k:v[-1]["status"] for k,v in endpoints.items()}},indent=2))
          PY
      - name: Commit response
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"; test -s "$OUT"
          git config user.name "AI2 Renko Recovery"
          git config user.email "ai2-renko-recovery@local.invalid"
          git add "$OUT"; git commit -m "ai2 renko recovery: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$n"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1
      - name: Enforce
        if: always()
        shell: bash
        run: python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));raise SystemExit(0 if d.get("ok") else 1)' "${{ steps.req.outputs.out }}"
