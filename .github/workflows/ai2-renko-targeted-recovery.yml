name: AI2 Renko Targeted Recovery

on:
  push:
    branches: [main]
    paths:
      - "ai2-renko-targeted-recovery-requests/**"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai2-renko-targeted-recovery-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai2-renko-targeted-recovery-responses/$ID.json" >> "$GITHUB_OUTPUT"
      - name: Sequential recovery
        env:
          ID: ${{ steps.req.outputs.id }}
          OUT: ${{ steps.req.outputs.out }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          python3 - <<'PY'
import json,os,time,urllib.request,urllib.error,pathlib
base="https://copytolive.com/api/charting/hyperliquid"
out={"id":os.environ["ID"],"ok":False,"checks":{}}
def req(path,timeout=25):
    u=base+path
    t=time.time()
    try:
        q=urllib.request.Request(u,headers={"User-Agent":"CopyToLive-AI2-Recovery","Cache-Control":"no-cache"})
        with urllib.request.urlopen(q,timeout=timeout) as r:
            b=r.read()
            try:d=json.loads(b)
            except:d={}
            return {"status":getattr(r,"status",200),"seconds":round(time.time()-t,3),"returned":len(d.get("candles") or []),"count":d.get("count"),"error":d.get("error","")}
    except urllib.error.HTTPError as e:
        return {"status":e.code,"seconds":round(time.time()-t,3),"returned":0,"error":str(e)}
    except Exception as e:
        return {"status":0,"seconds":round(time.time()-t,3),"returned":0,"error":str(e)}
for sym in ["NEO","SOL","GOLD","SILVER","WTIOIL","BRENTOIL"]:
    attempts=[]
    for n in range(1,11):
        x=req(f"/renko/{sym}?limit=400&smaPeriod=10&sma=10")
        x["n"]=n; attempts.append(x)
        if x["status"]==200 and x["returned"]>0: break
        time.sleep(min(8,n))
    out["checks"][sym]={"ok":attempts[-1]["status"]==200 and attempts[-1]["returned"]>0,"attempts":attempts}
for name,path in [("universe","/renko-universe"),("indicator","/indicator-catalog")]:
    attempts=[]
    for n in range(1,6):
        x=req(path);x["n"]=n;attempts.append(x)
        if x["status"]==200:break
        time.sleep(n)
    out["checks"][name]={"ok":attempts[-1]["status"]==200,"attempts":attempts}
out["ok"]=all(v["ok"] for v in out["checks"].values())
pathlib.Path(os.environ["OUT"]).write_text(json.dumps(out,indent=2)+"\n")
print(json.dumps(out,indent=2))
PY
      - name: Commit response
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"
          test -s "$OUT"
          git config user.name "AI2 Renko Targeted Recovery"
          git config user.email "ai2-renko-targeted@local.invalid"
          git add "$OUT"
          git commit -m "ai2 targeted recovery: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$n"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1
      - name: Enforce
        if: always()
        shell: bash
        run: python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));raise SystemExit(0 if d.get("ok") else 1)' "${{ steps.req.outputs.out }}"
