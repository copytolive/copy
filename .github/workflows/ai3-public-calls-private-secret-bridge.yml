name: AI3 Public Calls Private Secret Bridge
on:
  push:
    branches: [main]
    paths:
      - "ai3-private-bridge-requests/**"
permissions:
  contents: write
jobs:
  private-probe:
    uses: copytolive/archive-bridge-private/.github/workflows/ai3-private-secret-bridge-reusable.yml@main
  record:
    needs: private-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        env:
          PRESENT: ${{ needs.private-probe.outputs.secret_present }}
        run: |
          mkdir -p ai3-private-bridge-results
          python3 - <<'PY' > ai3-private-bridge-results/latest.json
          import json,os
          print(json.dumps({"ok":True,"secret_present":os.environ.get("PRESENT")=="true"},indent=2))
          PY
      - shell: bash
        run: |
          git config user.name "AI3 Private Bridge Probe"
          git config user.email "ai3-private-bridge@local.invalid"
          git add ai3-private-bridge-results/latest.json
          git commit -m "ai3 private bridge result" || true
          git pull --rebase origin main
          git push origin HEAD:main
