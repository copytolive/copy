name: AI3 Workflow Secret Inventory

on:
  push:
    branches: [main]
    paths:
      - "ai3-secret-inventory-requests/**"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai3-secret-inventory-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai3-secret-inventory-results/$ID.json" >> "$GITHUB_OUTPUT"
      - name: Inventory secret names only
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"; mkdir -p "$(dirname "$OUT")"
          python3 - <<'PY' "$OUT"
          import pathlib,re,json,sys
          rows=[]
          for p in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              s=p.read_text(errors='ignore')
              names=sorted(set(re.findall(r'secrets\.([A-Z0-9_]+)',s)))
              if names: rows.append({"file":str(p),"secret_names":names})
          pathlib.Path(sys.argv[1]).write_text(json.dumps({"ok":True,"workflows":rows},indent=2)+"\n")
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"
          git config user.name "CopyToLive AI3 Inventory"
          git config user.email "copytolive-ai3-inventory@local.invalid"
          git add "$OUT"
          git commit -m "ai3 secret inventory: ${{ steps.req.outputs.id }}"
          git pull --rebase origin main
          git push origin HEAD:main
