name: AI4 Private VPS Bridge

on:
  workflow_call:
    secrets:
      COPYTOLIVE_SSH_HOST:
        required: true
      COPYTOLIVE_SSH_USER:
        required: true
      COPYTOLIVE_SSH_KEY:
        required: true
      COPYTOLIVE_SSH_PORT:
        required: false

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.COPYTOLIVE_SSH_HOST }}
      SSH_USER: ${{ secrets.COPYTOLIVE_SSH_USER }}
      SSH_KEY: ${{ secrets.COPYTOLIVE_SSH_KEY }}
      SSH_PORT: ${{ secrets.COPYTOLIVE_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai4-public-bridge-requests/.*\.json$' | tail -n1)"
          test -n "$FILE"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          SAFE_ID="$(printf '%s' "$ID" | tr -cs 'A-Za-z0-9._-' '-')"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "id=$SAFE_ID" >> "$GITHUB_OUTPUT"
          echo "out=ai4-public-bridge-responses/$SAFE_ID.json" >> "$GITHUB_OUTPUT"
          echo "port=${SSH_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Execute guarded request on VPS
        shell: bash
        env:
          FILE: ${{ steps.req.outputs.file }}
          OUT: ${{ steps.req.outputs.out }}
          PORT: ${{ steps.req.outputs.port }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ai4_bridge"
          chmod 600 "$HOME/.ssh/ai4_bridge"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          REMOTE="/tmp/ai4-public-bridge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/ai4_bridge" -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE'"
          scp -q -i "$HOME/.ssh/ai4_bridge" -P "$PORT" server-control/handler.py "$FILE" "$SSH_USER@$SSH_HOST:$REMOTE/"
          mkdir -p "$(dirname "$OUT")"
          BASE="$(basename "$FILE")"
          set +e
          ssh -i "$HOME/.ssh/ai4_bridge" -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST"             "COPYTOLIVE_WEB_ROOT=/var/www/copytolive COPYTOLIVE_SOURCE_ROOT=/opt/copytolive-source COPYTOLIVE_BACKUP_ROOT=/var/backups/copytolive-control python3 '$REMOTE/handler.py' '$REMOTE/$BASE'" > "$OUT"
          RC=$?
          set -e
          ssh -i "$HOME/.ssh/ai4_bridge" -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "rm -rf '$REMOTE'" >/dev/null 2>&1 || true
          test -s "$OUT"
          python3 -m json.tool "$OUT" >/dev/null
          if [ "$RC" -ne 0 ]; then cat "$OUT"; exit "$RC"; fi

      - name: Commit response to caller repository
        if: always()
        shell: bash
        env:
          OUT: ${{ steps.req.outputs.out }}
        run: |
          set -euo pipefail
          test -s "$OUT"
          git config user.name "AI4 Public Runner Bridge"
          git config user.email "ai4-public-bridge@local.invalid"
          git add "$OUT"
          git commit -m "ai4 bridge response: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$n"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1

      - name: Enforce success
        if: always()
        shell: bash
        env:
          OUT: ${{ steps.req.outputs.out }}
        run: |
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));raise SystemExit(0 if d.get("ok") else 1)' "$OUT"
