name: AI6 Crypto REAL Hyperliquid Pending

on:
  push:
    branches: [main]
    paths:
      - "ai6-real-pending-requests/**"

permissions:
  contents: write

concurrency:
  group: ai6-crypto-real-pending-v2
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.COPYTOLIVE_SSH_HOST }}
      SSH_USER: ${{ secrets.COPYTOLIVE_SSH_USER }}
      SSH_KEY: ${{ secrets.COPYTOLIVE_SSH_KEY }}
      SSH_PORT_SECRET: ${{ secrets.COPYTOLIVE_SSH_PORT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai6-real-pending-requests/.*\.json$' | tail -n1)"
          test -n "$FILE"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai6-real-pending-results/$ID.json" >> "$GITHUB_OUTPUT"

      - name: Configure production SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          if [ -z "$SSH_PORT_SECRET" ]; then SSH_PORT_SECRET=22; fi
          echo "SSH_PORT_SECRET=$SSH_PORT_SECRET" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ai6-live-pending"
          chmod 600 "$HOME/.ssh/ai6-live-pending"
          ssh-keyscan -p "$SSH_PORT_SECRET" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

      - name: Deploy hardened V2 and accept without real order
        shell: bash
        env:
          ID: ${{ steps.req.outputs.id }}
          OUT: ${{ steps.req.outputs.out }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          REMOTE="/tmp/copytolive-ai6-$ID-$GITHUB_RUN_ID"
          cat >/tmp/ai6-v2-remote-run.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          ID="$1"
          DEP=/tmp/ai6-live-pending-v3-deploy.json
          ACC=/tmp/ai6-live-pending-v3-accept.json
          RB=/tmp/ai6-live-pending-v3-rollback.json
          rm -f "$DEP" "$ACC" "$RB" /tmp/ai6-v2-deploy.err /tmp/ai6-v2-accept.err /tmp/ai6-v2-rollback.err

          set +e
          AI6_REQUEST_ID="$ID" python3 deploy.py >"$DEP" 2>/tmp/ai6-v2-deploy.err
          DRC=$?
          set -e
          if [ "$DRC" -ne 0 ]; then
            python3 - "$DEP" /tmp/ai6-v2-deploy.err <<'PY'
          import json,pathlib,sys
          dp,ep=map(pathlib.Path,sys.argv[1:3])
          try:d=json.loads(dp.read_text()) if dp.exists() and dp.stat().st_size else {}
          except Exception:d={}
          print(json.dumps({"ok":False,"acceptance":"FAIL","stage":"deploy","deploy":d,"stderr":ep.read_text()[-5000:] if ep.exists() else "","real_order_submitted_during_acceptance":False}))
          PY
            exit 20
          fi

          python3 -m json.tool "$DEP" >/dev/null
          set +e
          python3 accept.py >"$ACC" 2>/tmp/ai6-v2-accept.err
          ARC=$?
          set -e
          if [ "$ARC" -ne 0 ]; then
            set +e
            AI6_DEPLOY_JSON="$DEP" python3 rollback.py >"$RB" 2>/tmp/ai6-v2-rollback.err
            RRC=$?
            set -e
            python3 - "$DEP" "$ACC" "$RB" /tmp/ai6-v2-accept.err /tmp/ai6-v2-rollback.err "$RRC" <<'PY'
          import json,pathlib,sys
          dp,ap,rp,ae,re,rrc=sys.argv[1:7]
          def load(p):
              p=pathlib.Path(p)
              try:return json.loads(p.read_text()) if p.exists() and p.stat().st_size else {}
              except Exception:return {}
          print(json.dumps({"ok":False,"acceptance":"FAIL","stage":"acceptance","deploy":load(dp),"acceptance_result":load(ap),"rollback":load(rp),"accept_stderr":pathlib.Path(ae).read_text()[-5000:] if pathlib.Path(ae).exists() else "","rollback_stderr":pathlib.Path(re).read_text()[-5000:] if pathlib.Path(re).exists() else "","rollback_rc":int(rrc),"real_order_submitted_during_acceptance":False}))
          PY
            exit 21
          fi

          python3 - "$DEP" "$ACC" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          a=json.loads(pathlib.Path(sys.argv[2]).read_text())
          ok=bool(d.get("ok")) and bool(a.get("ok")) and a.get("acceptance")=="PASS"
          print(json.dumps({"ok":ok,"acceptance":"PASS" if ok else "FAIL","stage":"complete","deploy":d,"acceptance_result":a,"real_order_submitted_during_acceptance":False}))
          raise SystemExit(0 if ok else 22)
          PY
          REMOTE_SCRIPT
          chmod +x /tmp/ai6-v2-remote-run.sh

          ssh -i "$HOME/.ssh/ai6-live-pending" -p "$SSH_PORT_SECRET" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE'"
          scp -q -i "$HOME/.ssh/ai6-live-pending" -P "$SSH_PORT_SECRET" ai6-live-pending-v3/deploy.py ai6-live-pending-v3/accept.py ai6-live-pending-v3/rollback.py /tmp/ai6-v2-remote-run.sh "$SSH_USER@$SSH_HOST:$REMOTE/"

          set +e
          ssh -i "$HOME/.ssh/ai6-live-pending" -p "$SSH_PORT_SECRET" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "cd '$REMOTE' && bash ai6-v2-remote-run.sh '$ID'" >"$OUT"
          RC=$?
          set -e
          ssh -i "$HOME/.ssh/ai6-live-pending" -p "$SSH_PORT_SECRET" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "rm -rf '$REMOTE'" >/dev/null 2>&1 || true

          test -s "$OUT"
          python3 -m json.tool "$OUT" >/dev/null
          if [ "$RC" -ne 0 ]; then cat "$OUT"; exit "$RC"; fi

      - name: Commit production receipt
        if: always()
        shell: bash
        env:
          OUT: ${{ steps.req.outputs.out }}
        run: |
          set -euo pipefail
          test -s "$OUT"
          git config user.name "CopyToLive AI6 Real Pending V2"
          git config user.email "copytolive-ai6@local.invalid"
          git add "$OUT"
          git commit -m "ai6 real pending v2: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5 6; do
            git pull --rebase origin main || { git rebase --abort || true; sleep "$n"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1

      - name: Enforce PASS
        if: always()
        shell: bash
        env:
          OUT: ${{ steps.req.outputs.out }}
        run: |
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));raise SystemExit(0 if d.get("ok") and d.get("acceptance")=="PASS" and not d.get("real_order_submitted_during_acceptance") else 1)' "$OUT"
