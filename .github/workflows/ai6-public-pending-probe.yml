name: AI6 Public Pending Probe
on:
  push:
    branches: [main]
    paths:
      - "ai6-public-pending-probe/**"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai6-public-pending-probe/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai6-public-pending-results/$ID.json" >> "$GITHUB_OUTPUT"
      - name: Probe production pending endpoints safely
        shell: bash
        env:
          OUT: ${{ steps.req.outputs.out }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          python3 - "$OUT" <<'PY'
          import json,sys,urllib.request,urllib.error,time
          out=sys.argv[1]; base="https://copytolive.com"
          results={}
          def call(path,method="GET",payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers={"Content-Type":"application/json","User-Agent":"AI6-public-pending-probe/1.0","Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode("utf-8","replace")
                      try: body=json.loads(raw)
                      except: body=raw[:1000]
                      return {"status":r.status,"body":body}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  try: body=json.loads(raw)
                  except: body=raw[:1000]
                  return {"status":e.code,"body":body}
              except Exception as e:
                  return {"status":0,"error":repr(e)}
          results["health"]=call("/api/bot-trading/health?ai6="+str(time.time_ns()))
          results["pending_confirm_false"]=call("/api/bot-trading/pending-open","POST",{
            "confirm_real":False,
            "wallet":"0x0000000000000000000000000000000000000001",
            "signal":{"symbol":"BTC/USD","hl_coin":"BTC","side":"LONG","entry":1000000,"sl":900000,"tp1":1200000,"signal_id":"ai6-safe-probe","expires_at_ms":int(time.time()*1000)+3600000},
            "risk_usdt":10,
            "idempotency_key":"ai6-safe-probe"
          })
          results["preview"]=call("/api/bot-trading/pending-open/preview","POST",{
            "signal":{"symbol":"BTC/USD","hl_coin":"BTC","side":"LONG","entry":1000000,"sl":900000,"tp1":1200000,"signal_id":"ai6-safe-preview","expires_at_ms":int(time.time()*1000)+3600000},
            "risk_usdt":10,"max_notional_usdt":1000
          })
          ok=results["health"].get("status")==200
          json.dump({"ok":ok,"results":results},open(out,"w"),indent=2)
          PY
      - name: Commit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"
          test -s "$OUT"
          git config user.name "CopyToLive AI6 Public Probe"
          git config user.email "copytolive-ai6@local.invalid"
          git add "$OUT"
          git commit -m "ai6 public pending probe: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep "$n"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1
