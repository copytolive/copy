name: Bootstrap CopyToLive Premium Account
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-premium-account.yml'
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Request private password setup email
        shell: bash
        env:
          ACCOUNT_EMAIL: copytolive@gmail.com
        run: |
          set -euo pipefail
          API="https://copytolive.com/api"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          export ACCOUNT_EMAIL
          node - <<'NODE' > "$WORK/forgot.json"
          process.stdout.write(JSON.stringify({email: process.env.ACCOUNT_EMAIL}));
          NODE
          CODE="$(curl -sS -o "$WORK/forgot.out" -w '%{http_code}' \
            -X POST "$API/auth/forgot-password" \
            -H 'Content-Type: application/json' \
            --data-binary @"$WORK/forgot.json")"
          echo "PASSWORD_SETUP_EMAIL_HTTP=$CODE"
          if [[ "$CODE" =~ ^2 ]]; then
            echo "PASSWORD_SETUP_EMAIL=REQUESTED"
          else
            echo "PASSWORD_SETUP_EMAIL=FAILED"
            cat "$WORK/forgot.out" | head -c 500
            exit 1
          fi
