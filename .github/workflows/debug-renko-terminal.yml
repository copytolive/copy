name: Debug Renko Terminal Mount
on:
  push:
    paths:
      - '.github/workflows/debug-renko-terminal.yml'
      - 'renko-terminal.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for terminal v2 deploy
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            curl -LfsS 'https://copytolive.github.io/copy/renko-terminal.html?debug=2' -o /tmp/r.html || true
            if grep -q 'dispatcherShared' /tmp/r.html 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Browser diagnostics
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank >/tmp/chrome.out 2>/tmp/chrome.err &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json && break || sleep .5; done
          cat >/tmp/debug.mjs <<'NODE'
          import fs from 'node:fs';
          const pages=JSON.parse(fs.readFileSync('/tmp/pages.json','utf8'));
          const target=pages.find(x=>x.type==='page');
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          let seq=0;const pending=new Map();const exceptions=[];const consoleLogs=[];
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return;}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params.exceptionDetails);if(m.method==='Runtime.consoleAPICalled')consoleLogs.push(m.params.args?.map(x=>x.value||x.description||'').join(' '));};
          await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});await send('Runtime.enable');await send('Page.enable');
          await send('Page.navigate',{url:'https://copytolive.github.io/copy/renko-terminal.html?embed=1&symbol=SOL&smaPeriod=10&v=debug'});await new Promise(r=>setTimeout(r,12000));
          const x=await send('Runtime.evaluate',{expression:`JSON.stringify({href:location.href,text:document.body.innerText,html:document.getElementById('root')?.innerHTML.slice(0,1000),shim:window.__CTL_RENKO_TERMINAL_SHIM__,mount:window.__CTL_RENKO_TERMINAL_MOUNT__})`,returnByValue:true});
          console.log('RENKO_DEBUG_STATE',x.result.value);console.log('RENKO_DEBUG_EXCEPTIONS',exceptions.map(e=>e.exception?.description||e.text));console.log('RENKO_DEBUG_CONSOLE',consoleLogs.slice(-20));
          ws.close();
          NODE
          node /tmp/debug.mjs
