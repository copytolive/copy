name: Deploy COPY to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare root-only dashboard and devlog-aligned runtime
        shell: bash
        run: |
          set -euo pipefail

          # Dashboard devlog contract:
          # balance/positions/history = real Hyperliquid wallet data;
          # strategy/pending/runner = CopyToLive engine; never use global engine
          # history as a user's wallet history.
          # User-facing navigation contract:
          # the browser address remains https://copytolive.github.io/copy/.
          test -f pages_root_bridge.js
          test -f pages_compounding_mirror.js
          test -f pages_wallet_bootstrap.js
          test -f pages_wallet_history.js
          test -f renko/hl-history-preview.js

          python3 - <<'PY'
          from pathlib import Path

          root_loader = '<script src="/copy/pages_root_bridge.js?v=20260826-root"></script>'

          # Every HTML surface receives the same root guard. At top level it
          # redirects standalone/deep pages back to /copy/. Inside an iframe it
          # returns immediately, so the SPA can still use recovered modules.
          html_pages = sorted(Path('.').rglob('*.html'))
          if not html_pages:
              raise SystemExit('No HTML pages found')
          for p in html_pages:
              s = p.read_text()
              if root_loader in s:
                  continue
              if p.as_posix() == 'index.html':
                  if '</body>' not in s:
                      raise SystemExit('Root </body> insertion anchor missing')
                  s = s.replace('</body>', root_loader + '\n</body>', 1)
              elif '</head>' in s:
                  s = s.replace('</head>', root_loader + '\n</head>', 1)
              elif '</body>' in s:
                  s = s.replace('</body>', root_loader + '\n</body>', 1)
              else:
                  s = root_loader + '\n' + s
              p.write_text(s)

          # Renko receives a deploy-time real-Hyperliquid history preview, then
          # yields to exact tick-native Renko when enough exact bricks arrive.
          p = Path('renko/index.html')
          s = p.read_text()
          loader = '<script src="hl-history-preview.js?v=20260826-devlog"></script>'
          anchor = '<script src="renko-v12-instant-history.js?v=2"></script>'
          if loader not in s:
              if anchor not in s:
                  raise SystemExit('Renko preview insertion anchor missing')
              s = s.replace(anchor, anchor + loader, 1)
          p.write_text(s)

          c = Path('compounding_live.html').read_text()
          a = c.find('pages_compounding_mirror.js')
          b = c.find('pages_wallet_bootstrap.js')
          if a < 0 or b < 0 or a >= b:
              raise SystemExit('Resolver/bootstrap order violates devlog contract')

          # Prove every deployed HTML surface is covered by the single-root guard.
          missing=[]
          for p in html_pages:
              if root_loader not in p.read_text():
                  missing.append(p.as_posix())
          if missing:
              raise SystemExit('Root guard missing: ' + ', '.join(missing))
          print('ROOT_GUARD_HTML_COUNT', len(html_pages))
          PY

          # Generate fresh deploy-time first-screen snapshots from Hyperliquid.
          # Public market data only; no wallet/session secret is stored.
          END_MS=$(date +%s%3N)
          START_MS=$((END_MS - 36*60*60*1000))
          for COIN in SOL BTC ETH; do
            OUT="renko/hl-bootstrap-${COIN}.json"
            curl -LfsS --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: application/json' \
              -X POST https://api.hyperliquid.xyz/info \
              --data "{\"type\":\"candleSnapshot\",\"req\":{\"coin\":\"${COIN}\",\"interval\":\"1m\",\"startTime\":${START_MS},\"endTime\":${END_MS}}}" \
              -o "$OUT"
            python3 - "$OUT" <<'PY'
          import json, sys
          path=sys.argv[1]
          data=json.load(open(path))
          assert isinstance(data,list), type(data)
          assert len(data) >= 60, len(data)
          for row in data[-20:]:
              assert row.get('c') is not None and row.get('t') is not None, row
          print('HL_BOOTSTRAP_PASS', path, len(data))
          PY
          done

          # Static contracts derived from the dashboard devlog/handover.
          grep -q 'pages_root_bridge.js?v=20260826-root' index.html
          grep -q "ROOT_URL = 'https://copytolive.github.io/copy/'" pages_root_bridge.js
          grep -q "location.pathname !== ROOT_PATH" pages_root_bridge.js
          grep -q "location.replace(ROOT_PATH)" pages_root_bridge.js
          grep -q "location.hostname === 'copytolive.github.io'" pages_compounding_mirror.js
          grep -q "location.hostname === 'copytolive.github.io'" pages_wallet_bootstrap.js
          grep -q "location.hostname === 'copytolive.github.io'" pages_wallet_history.js
          ! grep -q "for (var i=0;i<localStorage.length;i++)" pages_wallet_history.js
          grep -q "type:'userFills'" pages_wallet_history.js
          grep -q "type:'clearinghouseState'" pages_wallet_history.js
          grep -q "type:'userRole'" pages_compounding_mirror.js
          grep -q "type:'subAccounts'" pages_compounding_mirror.js
          grep -q 'hl-history-preview.js?v=20260826-devlog' renko/index.html
          node --check pages_root_bridge.js
          node --check renko/hl-history-preview.js
          node --check pages_compounding_mirror.js
          node --check pages_wallet_bootstrap.js
          node --check pages_wallet_history.js
          echo "ROOT_ONLY_DEVLOG_RUNTIME_CONTRACT=PASS"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live root shell, wallet contract and Backtest parity data
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://copytolive.github.io/copy"
          mkdir -p /tmp/copy-pages-verify

          ok=0
          for attempt in $(seq 1 18); do
            echo "Acceptance attempt ${attempt}/18"
            if curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/" -o /tmp/copy-pages-verify/index.html \
              && curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/pages_root_bridge.js?verify=${GITHUB_SHA}" -o /tmp/copy-pages-verify/root-bridge.js \
              && curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/compounding_live.html?verify=${GITHUB_SHA}" -o /tmp/copy-pages-verify/live.html \
              && curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/renko/?embed=1&symbol=SOL&verify=${GITHUB_SHA}" -o /tmp/copy-pages-verify/renko.html \
              && curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/renko/hl-bootstrap-SOL.json?verify=${GITHUB_SHA}" -o /tmp/copy-pages-verify/hl-sol.json \
              && curl -LfsS --connect-timeout 10 --max-time 60 "$BASE/data/backtest_farm_1.json?verify=${GITHUB_SHA}" -o /tmp/copy-pages-verify/farm1.json \
              && curl -LfsS --connect-timeout 10 --max-time 60 "$BASE/data/backtest_farm_2.json?verify=${GITHUB_SHA}" -o /tmp/copy-pages-verify/farm2.json \
              && curl -LfsS --connect-timeout 10 --max-time 60 "$BASE/data/backtest_summary.json?verify=${GITHUB_SHA}" -o /tmp/copy-pages-verify/summary.json \
              && curl -LfsS --connect-timeout 10 --max-time 60 "$BASE/data/backtest_local.json?verify=${GITHUB_SHA}" -o /tmp/copy-pages-verify/local.json \
              && python3 - <<'PY'
          import json
          a=json.load(open('/tmp/copy-pages-verify/farm1.json'))
          b=json.load(open('/tmp/copy-pages-verify/farm2.json'))
          s=json.load(open('/tmp/copy-pages-verify/summary.json'))
          l=json.load(open('/tmp/copy-pages-verify/local.json'))
          h=json.load(open('/tmp/copy-pages-verify/hl-sol.json'))
          assert len(a)+len(b)==118,(len(a),len(b))
          assert len(s)==250,len(s)
          assert len(l)==650,len(l)
          assert isinstance(h,list) and len(h)>=60,len(h)
          r=a[0]
          assert r['title']=='ND MTF LINREG_SLP — GOLD'
          assert r['totalTrades']==319
          assert round(float(r['profitFactor']),2)==1.84
          assert round(float(r['netProfit']),1)==31516.8
          root=open('/tmp/copy-pages-verify/index.html').read()
          assert 'pages_root_bridge.js?v=20260826-root' in root
          bridge=open('/tmp/copy-pages-verify/root-bridge.js').read()
          assert "ROOT_URL = 'https://copytolive.github.io/copy/'" in bridge
          assert "location.replace(ROOT_PATH)" in bridge
          assert "frame.src = 'renko/?embed=1&symbol=SOL'" in bridge
          live=open('/tmp/copy-pages-verify/live.html').read()
          assert 'pages_root_bridge.js?v=20260826-root' in live
          ia=live.find('pages_compounding_mirror.js')
          ib=live.find('pages_wallet_bootstrap.js')
          assert 0 <= ia < ib,(ia,ib)
          renko=open('/tmp/copy-pages-verify/renko.html').read()
          assert 'pages_root_bridge.js?v=20260826-root' in renko
          assert 'RENKO V12 — Tick Native' in renko
          assert 'hl-history-preview.js?v=20260826-devlog' in renko
          assert 'Charting sedang dalam pemeliharaan' not in renko
          print('LIVE_ROOT_ASSET_CONTRACT_PASS',len(h),len(a),len(b),len(s),len(l))
          PY
            then
              ok=1
              break
            fi
            sleep 5
          done

          test "$ok" = 1
          grep -q '<div id="root"></div>' /tmp/copy-pages-verify/index.html
          echo "COPY_ROOT_ASSET_ACCEPTANCE=PASS"

      - name: Browser acceptance - single root URL Charting and deep-link redirect
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank \
            >/tmp/chrome.out 2>/tmp/chrome.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json; then break; fi
            sleep .5
          done
          test -s /tmp/pages.json

          cat >/tmp/root-cdp.mjs <<'NODE'
          import fs from 'node:fs';
          const ROOT='https://copytolive.github.io/copy/';
          const pages=JSON.parse(fs.readFileSync('/tmp/pages.json','utf8'));
          const target=pages.find(x=>x.type==='page');
          if(!target?.webSocketDebuggerUrl) throw new Error('No CDP target');
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          let seq=0; const pending=new Map();
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);}};
          await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          await send('Runtime.enable'); await send('Page.enable');

          // Main application acceptance starts and remains on the sole root URL.
          await send('Page.navigate',{url:ROOT});
          await new Promise(r=>setTimeout(r,2500));
          await send('Runtime.evaluate',{expression:`localStorage.setItem('ot_backtest_view_mode','charting'); location.reload(); true`,returnByValue:true});
          await new Promise(r=>setTimeout(r,12000));

          const x=await send('Runtime.evaluate',{expression:`(()=>{const f=document.querySelector('iframe[title="CopyToLive Charting"]');const w=f?.contentWindow;const d=f?.contentDocument;return JSON.stringify({href:location.href,maintenance:document.body.innerText.includes('Charting sedang dalam pemeliharaan'),bridge:!!window.__COPYTOLIVE_ROOT_CHARTING__?.mounted,frame:!!f,frameSrc:f?.getAttribute('src')||'',frameReady:d?.readyState||'',selected:w?.RWARenkoV3?.state?.selected||'',exact:w?.RWARenkoV12?.state?.data?.length||0,preview:w?.CTLHLRenkoPreview?.bars?.length||0,frameMaintenance:d?.body?.innerText?.includes('Charting sedang dalam pemeliharaan')||false,hasNaN:/\\bNaN\\b|\\bInfinity\\b/.test(d?.body?.innerText||'')});})()`,returnByValue:true});
          const state=JSON.parse(x.result.value);
          console.log('ROOT_CHARTING_STATE',state);
          if(state.href!==ROOT) throw new Error('Address bar escaped root: '+state.href);
          if(state.maintenance) throw new Error('Root maintenance placeholder still visible');
          if(!state.bridge || !state.frame) throw new Error('Root Charting bridge did not mount');
          if(state.frameSrc!=='renko/?embed=1&symbol=SOL') throw new Error('Unexpected internal chart source: '+state.frameSrc);
          if(state.frameReady!=='complete') throw new Error('Chart frame not ready: '+state.frameReady);
          if(state.selected!=='SOLUSDT') throw new Error('Expected SOLUSDT, got '+state.selected);
          if(Math.max(state.exact,state.preview)<20) throw new Error('No usable first-screen Charting history');
          if(state.frameMaintenance) throw new Error('Maintenance text leaked into live chart');
          if(state.hasNaN) throw new Error('Visible NaN/Infinity detected');

          const y=await send('Runtime.evaluate',{expression:`(async()=>{const end=Date.now(),start=end-3600000;const r=await fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'candleSnapshot',req:{coin:'SOL',interval:'1m',startTime:start,endTime:end}})});const d=await r.json();return JSON.stringify({href:location.href,ok:r.ok,status:r.status,len:Array.isArray(d)?d.length:0});})()`,awaitPromise:true,returnByValue:true});
          const hl=JSON.parse(y.result.value);
          console.log('ROOT_HYPERLIQUID_BROWSER_CORS',hl);
          if(hl.href!==ROOT) throw new Error('Address bar changed during CORS test: '+hl.href);
          if(!hl.ok || hl.len<20) throw new Error('Hyperliquid browser CORS/data check failed');

          // A representative standalone deep page must redirect back to ROOT.
          await send('Page.navigate',{url:'https://copytolive.github.io/copy/renko/?embed=1&symbol=SOL'});
          await new Promise(r=>setTimeout(r,3000));
          const z=await send('Runtime.evaluate',{expression:`JSON.stringify({href:location.href,pathname:location.pathname})`,returnByValue:true});
          const redirected=JSON.parse(z.result.value);
          console.log('DEEP_LINK_REDIRECT_STATE',redirected);
          if(redirected.href!==ROOT || redirected.pathname!=='/copy/') throw new Error('Deep page did not return to root');

          console.log('SINGLE_PUBLIC_ROOT_ACCEPTANCE=PASS');
          ws.close();
          NODE
          node /tmp/root-cdp.mjs
