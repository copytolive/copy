name: Apply dashboard devlog fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dashboard-devlog.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dashboard-devlog-fix
  cancel-in-progress: false
jobs:
  fix:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Import current Renko V12
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/copytolive/rwa/main/renko"
          mkdir -p renko
          for f in index.html renko.css renko-v2.css renko-v3.css renko-v9-lwc.css renko-v10.css renko-v11.css renko-v3.js renko-v12.js renko-v12-worker.js renko-v12-method-profiles.js renko-v12-instant-history.js; do
            curl -LfsS "$base/$f" -o "renko/$f"
          done

      - name: Patch Pages and devlog integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          old = "var IS_PAGES = location.hostname === 'narzulalistiqlal.github.io' && location.pathname.indexOf('/copy/') === 0;"
          new = "var IS_PAGES = location.hostname === 'copytolive.github.io' && location.pathname.indexOf('/copy/') === 0;"
          for name in ['pages_compounding_mirror.js','pages_wallet_bootstrap.js','pages_wallet_history.js']:
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'old Pages host guard not found in {name}')
              p.write_text(s.replace(old, new, 1))

          p = Path('pages_wallet_history.js')
          s = p.read_text()
          pattern = r"\n    try \{\n      for \(var i=0;i<localStorage\.length;i\+\+\) \{\n        var k = localStorage\.key\(i\) \|\| '';\n        if \(k\.indexOf\('ot_wallet_'\) === 0\) candidates\.push\(localStorage\.getItem\(k\)\);\n      \}\n    \} catch\(e\) \{\}"
          s, n = re.subn(pattern, "\n    // Session isolation: never enumerate another Premium login's ot_wallet_* keys.", s, count=1)
          if n != 1:
              raise SystemExit(f'wallet cross-session enumeration patch count={n}')
          p.write_text(s)

          p = Path('renko/index.html')
          s = p.read_text()
          s = s.replace('<head><script src="../legacy-canonical.js?v=6"></script>', '<head>', 1)
          boot = r'''<script>
          (() => {
            const q = new URLSearchParams(location.search);
            if (q.get('embed') === '1') document.documentElement.classList.add('ctl-embed');
            let raw = (q.get('symbol') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (raw) {
              if (!/(USDT|USDC|FDUSD|BTC|ETH|BNB)$/.test(raw)) raw += 'USDT';
              try {
                const key = 'rwa_renko_traditional_v3';
                const pref = JSON.parse(localStorage.getItem(key) || '{}');
                pref.selected = raw;
                pref.visible = 60;
                localStorage.setItem(key, JSON.stringify(pref));
              } catch (e) {}
            }
          })();
          </script>
          <style>
          html.ctl-embed,html.ctl-embed body,html.ctl-embed .app{height:100%;min-height:100%;overflow:hidden}
          html.ctl-embed .topbar,html.ctl-embed .markets,html.ctl-embed .instrument-bar,html.ctl-embed .easybar,
          html.ctl-embed .v10-toolbar,html.ctl-embed .methodology,html.ctl-embed .lwc-attribution{display:none!important}
          html.ctl-embed .workspace{display:block!important;min-height:100vh!important;height:100vh!important}
          html.ctl-embed .terminal{padding:0!important;height:100vh!important;display:flex!important;flex-direction:column!important}
          html.ctl-embed .tv-toolbar{flex:0 0 auto!important}
          html.ctl-embed .chart-wrap{flex:1 1 auto!important;height:auto!important;min-height:0!important;max-height:none!important;border-radius:0!important}
          </style>'''
          if '</head>' not in s:
              raise SystemExit('Renko </head> not found')
          s = s.replace('</head>', boot + '\n</head>', 1)
          p.write_text(s)

          p = Path('compounding_live.html')
          s = p.read_text()
          marker = '    <!-- Risk Disclaimer Footer -->'
          inject = '''    <!-- GitHub Pages Hyperliquid resolver: devlog source-of-truth order. -->
              <script src="pages_compounding_mirror.js?v=20260826-devlog"></script>
              <script src="pages_wallet_bootstrap.js?v=20260826-devlog"></script>

          '''
          if 'pages_compounding_mirror.js?v=20260826-devlog' not in s:
              if marker not in s:
                  raise SystemExit('compounding injection marker not found')
              s = s.replace(marker, inject + marker, 1)
          p.write_text(s)
          PY

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-v3.js
          node --check renko/renko-v12.js
          node --check renko/renko-v12-worker.js
          node --check renko/renko-v12-method-profiles.js
          node --check renko/renko-v12-instant-history.js
          node --check pages_compounding_mirror.js
          node --check pages_wallet_bootstrap.js
          node --check pages_wallet_history.js
          grep -q 'RENKO V12 — Tick Native' renko/index.html
          grep -q 'FIRST_VIEW=60' renko/renko-v12.js
          grep -q "location.hostname === 'copytolive.github.io'" pages_wallet_history.js
          ! grep -q "for (var i=0;i<localStorage.length;i++)" pages_wallet_history.js
          grep -q 'pages_compounding_mirror.js?v=20260826-devlog' compounding_live.html

      - name: Commit repaired dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "copytolive-dashboard-fix"
          git config user.email "actions@users.noreply.github.com"
          git add renko pages_compounding_mirror.js pages_wallet_bootstrap.js pages_wallet_history.js compounding_live.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix(pages): restore live Renko and Hyperliquid wallet source"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy repaired Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify deployed assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://copytolive.github.io/copy"
          ok=0
          for i in $(seq 1 18); do
            echo "asset acceptance $i/18"
            if curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/renko/?embed=1&symbol=SOL&verify=$GITHUB_SHA" -o /tmp/renko.html \
              && grep -q 'RENKO V12 — Tick Native' /tmp/renko.html \
              && ! grep -q 'Charting sedang dalam pemeliharaan' /tmp/renko.html \
              && curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/renko/renko-v12.js?verify=$GITHUB_SHA" -o /tmp/v12.js \
              && grep -q 'FIRST_VIEW=60' /tmp/v12.js \
              && curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/pages_wallet_history.js?verify=$GITHUB_SHA" -o /tmp/wallet.js \
              && grep -q "location.hostname === 'copytolive.github.io'" /tmp/wallet.js \
              && ! grep -q "for (var i=0;i<localStorage.length;i++)" /tmp/wallet.js \
              && curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/compounding_live.html?verify=$GITHUB_SHA" -o /tmp/live.html \
              && grep -q 'pages_compounding_mirror.js?v=20260826-devlog' /tmp/live.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo "DASHBOARD_ASSET_ACCEPTANCE=PASS"

      - name: Browser acceptance for Renko first screen
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank >/tmp/chrome.out 2>/tmp/chrome.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json && break || sleep .5; done
          cat >/tmp/renko-cdp.mjs <<'NODE'
          import fs from 'node:fs';
          const pages=JSON.parse(fs.readFileSync('/tmp/pages.json','utf8'));
          const target=pages.find(x=>x.type==='page');
          if(!target?.webSocketDebuggerUrl) throw new Error('No CDP target');
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          let seq=0; const pending=new Map(); const exceptions=[];
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return;}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params.exceptionDetails);};
          await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          await send('Runtime.enable'); await send('Page.enable');
          await send('Page.navigate',{url:'https://copytolive.github.io/copy/renko/?embed=1&symbol=SOL&accept=devlog'});
          await new Promise(r=>setTimeout(r,22000));
          const x=await send('Runtime.evaluate',{expression:`JSON.stringify({title:document.title,text:document.body.innerText.slice(0,1800),selected:window.RWARenkoV3?.state?.selected||'',bricks:window.RWARenkoV12?.state?.data?.length||0,hostVisibility:getComputedStyle(document.getElementById('lwcRenkoHost')||document.body).visibility,maintenance:document.body.innerText.includes('Charting sedang dalam pemeliharaan')})`,returnByValue:true});
          const state=JSON.parse(x.result.value);
          console.log('RENKO_STATE',state);
          if(!state.title.includes('RENKO V12')) throw new Error('Renko title missing');
          if(state.maintenance) throw new Error('Maintenance placeholder still present');
          if(state.selected!=='SOLUSDT') throw new Error('Expected SOLUSDT, got '+state.selected);
          if(state.bricks<20) throw new Error('Insufficient first-screen history bricks: '+state.bricks);
          if(state.hostVisibility!=='visible') throw new Error('Lightweight chart host not visible');
          if(exceptions.length) console.log('RENKO_BROWSER_EXCEPTIONS',exceptions.map(e=>e.text));
          console.log('RENKO_BROWSER_ACCEPTANCE=PASS');
          ws.close();
          NODE
          node /tmp/renko-cdp.mjs
