name: Fix Hyperliquid GitHub Pages paths
on:
  push:
    paths:
      - '.github/workflows/fix-hyperliquid-pages-paths.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch project-pages iframe paths safely
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('assets/js/index-DNfwXZJH.js')
          s = main.read_text()
          replacements = {
              'src:"/compounding_live.html?v=20260821-loginfix"': 'src:"compounding_live.html?v=20260821-loginfix"',
              'src:"/meteora_live.html?allowIframe=1&source=copytolive&section=execution"': 'src:"meteora_live.html?allowIframe=1&source=copytolive&section=execution"',
              'src:"/jupiter_live.html?allowIframe=1&embed=1&source=copytolive"': 'src:"jupiter_live.html?allowIframe=1&embed=1&source=copytolive"',
              'src:"/meteora_live.html?allowIframe=1&source=copytolive&section=execution&dashboard=robinhood"': 'src:"meteora_live.html?allowIframe=1&source=copytolive&section=execution&dashboard=robinhood"',
              'src:"/compounding_plan.html"': 'src:"compounding_plan.html"',
          }
          changed = 0
          for old,new in replacements.items():
              n=s.count(old)
              print('MAIN_REPLACE', old, 'count=', n)
              if n:
                  s=s.replace(old,new)
                  changed += n
          if 'src:"/compounding_live.html?v=20260821-loginfix"' in s:
              raise SystemExit('Hyperliquid root-relative iframe path still present')
          main.write_text(s)

          live = Path('compounding_live.html')
          h = live.read_text()
          old='src="/renko?embed=1&symbol=SOL&smaPeriod=10&sma=10&v=sma10_live_20260823"'
          new='src="renko/?embed=1&symbol=SOL&smaPeriod=10&sma=10&v=sma10_live_20260823"'
          print('RENKO_REPLACE count=', h.count(old))
          h=h.replace(old,new)
          if 'src="/renko?embed=1' in h:
              raise SystemExit('Renko root-relative iframe path still present')
          live.write_text(h)

          if changed < 1:
              raise SystemExit('Expected main bundle patch was not applied')
          PY
          node --check assets/js/index-DNfwXZJH.js
          grep -F 'src:"compounding_live.html?v=20260821-loginfix"' assets/js/index-DNfwXZJH.js >/dev/null
          grep -F 'src="renko/?embed=1&symbol=SOL' compounding_live.html >/dev/null
      - name: Commit fixed Pages paths
        run: |
          set -euo pipefail
          git config user.name 'copytolive'
          git config user.email 'copytolive@gmail.com'
          git add assets/js/index-DNfwXZJH.js compounding_live.html
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'fix(pages): load Hyperliquid dashboard inside project site'
          git push origin HEAD:main
