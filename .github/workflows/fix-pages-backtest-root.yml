name: Fix CopyToLive Pages Backtest root

on:
  push:
    paths:
      - '.github/workflows/fix-pages-backtest-root.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Treat copytolive.github.io as CopyToLive Backtest host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/index-DNfwXZJH.js')
          s=p.read_text()
          old='r="undefined"!=typeof window&&ZN.test(window.location.hostname)'
          new='r="undefined"!=typeof window&&(ZN.test(window.location.hostname)||"copytolive.github.io"===window.location.hostname)'
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'Expected one host-route marker, found {count}')
          s=s.replace(old,new,1)
          p.write_text(s)
          print('ROUTE_PATCH_OK')
          PY
          node --check assets/js/index-DNfwXZJH.js

      - name: Commit route patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'copytolive-pages-bot'
          git config user.email 'copytolive-pages-bot@users.noreply.github.com'
          git add assets/js/index-DNfwXZJH.js
          if git diff --cached --quiet; then
            echo 'Route patch already present.'
          else
            git commit -m 'fix(pages): open Backtest dashboard at CopyToLive Pages root'
            git push origin HEAD:main
          fi
