name: History V21 Legacy Syntax
on:
  push:
    branches: [main]
    paths:
      - 'history_hl_portfolio_v21.js'
      - '.github/workflows/history-v21-portfolio-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy module remains syntactically valid
        run: |
          set -euo pipefail
          node --check history_hl_portfolio_v21.js
          echo V21_LEGACY_SYNTAX=PASS
