name: History V23/V28 Pending First-Paint Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'history_hl_fix_v23.js'
      - 'history_hl_sync_v7_guard.js'
      - 'history_firstpaint_v28.js'
      - 'history_hl_pending_v19.js'
      - 'history_hl_mode_v20.js'
      - 'history_hl_ui_arbiter_v22.js'
      - 'tests/history_v23_pending_chart_fixture.html'
      - 'tests/history_v23_pending_antiflicker_fixture.html'
      - 'tests/history_v28_firstpaint_fixture.html'
      - '.github/workflows/history-v23-pending-chart-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check history_hl_fix_v23.js
          node --check history_hl_sync_v7_guard.js
          node --check history_firstpaint_v28.js
          node --check history_hl_mode_v20.js
          grep -q 'renderOwnerAware:true' history_hl_mode_v20.js
          grep -q 'function ownerRender' history_hl_mode_v20.js
          grep -q 'pending-history-hybrid' history_hl_fix_v23.js
          grep -q 'pendingDomMatches' history_hl_fix_v23.js
          grep -q '#equityChart{visibility:hidden!important' history_hl_fix_v23.js
          grep -q 'hybrid-single-owner-7' history_hl_sync_v7_guard.js
          grep -q 'history_firstpaint_v28.js' history_hl_sync_v7_guard.js
          grep -q 'first-second-1' history_hl_sync_v7_guard.js
          grep -q 'workspace-renko-history' history_hl_sync_v7_guard.js
          grep -q 'rrMonitorBox' history_hl_sync_v7_guard.js
          ! grep -q 'history_ui_cleanup_v24.js' history_hl_sync_v7_guard.js
          ! grep -q 'history_ui_restore_v25.js' history_hl_sync_v7_guard.js
          grep -q 'account-safe-meta-cache-no-dom-writer' history_firstpaint_v28.js
          echo V28_STATIC_CONTRACT=PASS
      - name: Headless Chrome active TP SL and chart stress
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          HPID=$!
          trap 'kill $HPID 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/tests/history_v23_pending_chart_fixture.html >/dev/null && break || sleep .2; done
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1700,900 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/tests/history_v23_pending_chart_fixture.html >/tmp/v23-dom.html
          python3 - <<'PY'
          import html,re
          s=open('/tmp/v23-dom.html').read(); m=re.search(r'<pre id="result"[^>]*>(.*?)</pre>',s,re.S); assert m, 'result missing'
          result=html.unescape(re.sub(r'<[^>]*>','',m.group(1))).strip(); print('V23_RENDERED_RESULT',result)
          assert result.startswith('V23_PENDING_CHART_ACCEPTANCE=PASS'), result
          for token in ['rows=2','SL','TP','TOTAL ENTRY 1','baseVis=hidden','baseOpacity=0','overlay=true']: assert token in result, result
          PY
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1700,900 --virtual-time-budget=8000 --screenshot=/tmp/history-v23-pending-chart.png http://127.0.0.1:8000/tests/history_v23_pending_chart_fixture.html
      - name: Headless Chrome Pending Order anti-flicker stress
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8001 --bind 127.0.0.1 >/tmp/http-antiflicker.log 2>&1 &
          HPID2=$!
          trap 'kill $HPID2 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/tests/history_v23_pending_antiflicker_fixture.html >/dev/null && break || sleep .2; done
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1700,900 --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8001/tests/history_v23_pending_antiflicker_fixture.html >/tmp/v23-antiflicker-dom.html
          python3 - <<'PY'
          import html,re
          s=open('/tmp/v23-antiflicker-dom.html').read(); m=re.search(r'<pre id="result"[^>]*>(.*?)</pre>',s,re.S); assert m
          result=html.unescape(re.sub(r'<[^>]*>','',m.group(1))).strip(); print('V23_ANTIFLICKER_RESULT',result)
          assert result.startswith('V23_PENDING_ANTIFLICKER=PASS'), result
          for token in ['bad=0','samples=30','rows=2','TOTAL ENTRY 1']: assert token in result, result
          PY
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1700,900 --virtual-time-budget=7000 --screenshot=/tmp/history-v23-pending-antiflicker.png http://127.0.0.1:8001/tests/history_v23_pending_antiflicker_fixture.html
      - name: Headless Chrome first-second ALL Pending Direct hydration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8002 --bind 127.0.0.1 >/tmp/http-v28.log 2>&1 &
          HPID3=$!
          trap 'kill $HPID3 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8002/tests/history_v28_firstpaint_fixture.html >/dev/null && break || sleep .2; done
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1700,900 --virtual-time-budget=1200 --dump-dom http://127.0.0.1:8002/tests/history_v28_firstpaint_fixture.html >/tmp/v28-dom.html
          python3 - <<'PY'
          import html,re
          s=open('/tmp/v28-dom.html').read(); m=re.search(r'<pre id="result"[^>]*>(.*?)</pre>',s,re.S); assert m
          result=html.unescape(re.sub(r'<[^>]*>','',m.group(1))).strip(); print('V28_FIRSTPAINT_RESULT',result)
          assert result.startswith('V28_FIRSTPAINT=PASS'), result
          for token in ['all=3','pending=2','direct=1','rrGone=true','renkoGone=true','hydrated=true']: assert token in result, result
          ms=int(re.search(r'elapsed=(\d+)ms',result).group(1)); assert ms < 1000, result
          PY
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1700,900 --virtual-time-budget=1200 --screenshot=/tmp/history-v28-firstpaint.png http://127.0.0.1:8002/tests/history_v28_firstpaint_fixture.html
      - name: Verify production loader
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://copytolive.github.io/copy'; ok=0
          for i in $(seq 1 36); do
            curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/history_hl_sync_v7_guard.js?sha=${GITHUB_SHA}" -o /tmp/guard.js || true
            curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/history_hl_fix_v23.js?sha=${GITHUB_SHA}" -o /tmp/v23.js || true
            curl -LfsS --connect-timeout 10 --max-time 30 "$BASE/history_firstpaint_v28.js?sha=${GITHUB_SHA}" -o /tmp/v28.js || true
            if grep -q 'hybrid-single-owner-7' /tmp/guard.js 2>/dev/null && grep -q 'first-second-1' /tmp/guard.js 2>/dev/null && grep -q 'pending-history-hybrid' /tmp/v23.js 2>/dev/null && grep -q 'account-safe-meta-cache-no-dom-writer' /tmp/v28.js 2>/dev/null; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo V28_PRODUCTION_LOADER=PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-v28-firstpaint-regression-screenshots
          path: |
            /tmp/history-v23-pending-chart.png
            /tmp/history-v23-pending-antiflicker.png
            /tmp/history-v28-firstpaint.png
