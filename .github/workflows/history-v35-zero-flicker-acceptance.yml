name: History V35 Zero Flicker Acceptance
on:
  push:
    branches: [main, fix/history-v35-zero-flicker-20260827]
  workflow_dispatch:
jobs:
  zero-flicker-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static single-writer contracts
        run: |
          set -euo pipefail
          node --check history_zero_flicker_v35.js
          node --check history_real_metrics_v30.js
          grep -q "periodicPaintDisabledBy='v35-zero-flicker'" history_zero_flicker_v35.js
          grep -q "single-render-fingerprint" history_zero_flicker_v35.js
          grep -q "history_zero_flicker_v35.js" history_real_metrics_v30.js
          echo V35_STATIC=PASS
      - name: Browser temporal no-flicker stress
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          HPID=$!
          trap 'kill $HPID 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/tests/history_v35_zero_flicker_fixture.html >/dev/null && break || sleep .2; done
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1800,800 --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8000/tests/history_v35_zero_flicker_fixture.html >/tmp/v35-dom.html
          python3 - <<'PY'
          import html,re
          s=open('/tmp/v35-dom.html').read()
          m=re.search(r'<pre id="result"[^>]*>(.*?)</pre>',s,re.S)
          assert m, 'result missing'
          r=html.unescape(re.sub(r'<[^>]*>','',m.group(1))).strip()
          print(r)
          assert r.startswith('V35_ZERO_FLICKER=PASS'), r
          assert 'bad=0' in r and 'internalBad=0' in r, r
          PY
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1800,800 --virtual-time-budget=7000 --screenshot=/tmp/v35-zero-flicker.png http://127.0.0.1:8000/tests/history_v35_zero_flicker_fixture.html
          echo V35_BROWSER=PASS
      - name: Production browser after deploy
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          OK=0
          for i in $(seq 1 24); do
            if curl -fsS "https://copytolive.github.io/copy/history_zero_flicker_v35.js?sha=${GITHUB_SHA}" | grep -q 'single-render-fingerprint'; then OK=1; break; fi
            sleep 5
          done
          test "$OK" = 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1800,1000 --virtual-time-budget=12000 --dump-dom "https://copytolive.github.io/copy/?v35=${GITHUB_SHA}" >/tmp/v35-live-dom.html
          grep -q 'Detailed Trade Log · ALL PAIRS' /tmp/v35-live-dom.html
          grep -q 'ctlHistoryZeroFlickerV35Script' /tmp/v35-live-dom.html
          grep -q 'ctlHistoryZeroFlickerV35Style' /tmp/v35-live-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1800,1000 --virtual-time-budget=12000 --screenshot=/tmp/v35-production.png "https://copytolive.github.io/copy/?v35=${GITHUB_SHA}"
          echo V35_PRODUCTION_BROWSER=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: history-v35-zero-flicker-screenshots
          path: |
            /tmp/v35-zero-flicker.png
            /tmp/v35-production.png
          if-no-files-found: ignore
