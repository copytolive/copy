name: History V35 Zero Flicker Acceptance
on:
  push:
    branches: [main, fix/history-v35-zero-flicker-20260827]
  workflow_dispatch:
jobs:
  zero-flicker-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static single-writer contracts
        run: |
          set -euo pipefail
          node --check history_zero_flicker_v35.js
          node --check history_real_metrics_v30.js
          grep -q "periodicPaintDisabledBy='v35-zero-flicker'" history_zero_flicker_v35.js
          grep -q "single-render-fingerprint" history_zero_flicker_v35.js
          grep -q "history_zero_flicker_v35.js" history_real_metrics_v30.js
          grep -q "v35-zero-flicker-2" history_hl_sync_v7_guard.js
          echo V35_STATIC=PASS
      - name: Browser temporal no-flicker stress
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          HPID=$!
          trap 'kill $HPID 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/tests/history_v35_zero_flicker_fixture.html >/dev/null && break || sleep .2; done
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1800,800 --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8000/tests/history_v35_zero_flicker_fixture.html >/tmp/v35-dom.html
          python3 - <<'PY'
          import html,re
          s=open('/tmp/v35-dom.html').read()
          m=re.search(r'<pre id="result"[^>]*>(.*?)</pre>',s,re.S)
          assert m, 'result missing'
          r=html.unescape(re.sub(r'<[^>]*>','',m.group(1))).strip()
          print(r)
          assert r.startswith('V35_ZERO_FLICKER=PASS'), r
          assert 'bad=0' in r and 'internalBad=0' in r, r
          PY
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1800,800 --virtual-time-budget=7000 --screenshot=/tmp/v35-zero-flicker.png http://127.0.0.1:8000/tests/history_v35_zero_flicker_fixture.html
          echo V35_BROWSER=PASS
      - name: Production browser after deploy
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          BASE="https://copytolive.github.io/copy"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"

          # Do not confuse an older Pages deployment with the current release.
          # Both the new V35 asset and the cache-busted canonical guard must be live.
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/history_zero_flicker_v35.js?sha=${GITHUB_SHA}" | grep -q 'first-frame-lock' \
              && curl -fsS "$BASE/history_hl_sync_v7_guard.js?sha=${GITHUB_SHA}" | grep -q 'v35-zero-flicker-2'; then
              OK=1
              break
            fi
            sleep 5
          done
          test "$OK" = 1

          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --window-size=1800,1100 --remote-debugging-address=127.0.0.1 --remote-debugging-port=9235 about:blank \
            >/tmp/v35-chrome.out 2>/tmp/v35-chrome.err &
          CPID=$!
          trap 'kill $CPID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9235/json/list >/tmp/v35-pages.json; then break; fi
            sleep .5
          done
          test -s /tmp/v35-pages.json

          cat >/tmp/v35-production.mjs <<'NODE'
          import fs from 'node:fs';
          const ROOT='https://copytolive.github.io/copy/';
          const pages=JSON.parse(fs.readFileSync('/tmp/v35-pages.json','utf8'));
          const target=pages.find(x=>x.type==='page');
          if(!target?.webSocketDebuggerUrl) throw new Error('No CDP target');
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          let seq=0;const pending=new Map();
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);}};
          await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          await send('Runtime.enable');await send('Page.enable');
          await send('Page.navigate',{url:ROOT});
          await new Promise(r=>setTimeout(r,2500));
          await send('Runtime.evaluate',{expression:`localStorage.setItem('ot_backtest_view_mode','charting');location.reload();true`,returnByValue:true});
          await new Promise(r=>setTimeout(r,15500));
          const res=await send('Runtime.evaluate',{expression:`(()=>{const f=document.getElementById('ctlSequentialCompoundingRoot');const d=f?.contentDocument;const w=f?.contentWindow;const p=d?.getElementById('backtestHistoryPanel');const t=p?.firstElementChild?.firstElementChild;const z=w?.__CTL_ZERO_FLICKER_V35__;const ps=p?getComputedStyle(p):null;const ts=t?getComputedStyle(t):null;const r=t?.getBoundingClientRect();return JSON.stringify({href:location.href,frame:!!f,frameReady:d?.readyState||'',title:(t?.textContent||'').trim(),v35:!!z?.ready,version:z?.version||0,bad:z?.badFrames??-1,samples:z?.samples||0,renders:z?.renders||0,skipped:z?.skipped||0,timers:z?.timersStopped||0,script:!!d?.getElementById('ctlHistoryZeroFlickerV35Script'),style:!!d?.getElementById('ctlHistoryZeroFlickerV35Style'),renderMarker:!!w?.__CTL_HISTORY_STABLE__?.render?.__ctlV35,display:ps?.display||'',visibility:ps?.visibility||'',opacity:ps?.opacity||'',titleVisibility:ts?.visibility||'',titleOpacity:ts?.opacity||'',titleW:r?.width||0,titleH:r?.height||0});})()`,returnByValue:true});
          const s=JSON.parse(res.result.value);
          console.log('V35_PRODUCTION_STATE',s);
          if(s.href!==ROOT) throw new Error('Root URL changed: '+s.href);
          if(!s.frame||s.frameReady!=='complete') throw new Error('Sequential iframe not ready');
          if(s.title!=='📋 Detailed Trade Log · ALL PAIRS') throw new Error('Detailed Trade Log title mismatch: '+s.title);
          if(!s.v35||s.version<35||!s.script||!s.style||!s.renderMarker) throw new Error('V35 runtime not canonical');
          if(s.bad!==0||s.samples<30) throw new Error('Temporal visibility failed: '+JSON.stringify(s));
          if(s.display==='none'||s.visibility==='hidden'||Number(s.opacity)<0.99||s.titleVisibility==='hidden'||Number(s.titleOpacity)<0.99||s.titleW<1||s.titleH<1) throw new Error('Panel/title not visibly stable');
          const shot=await send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});
          fs.writeFileSync('/tmp/v35-production.png',Buffer.from(shot.data,'base64'));
          console.log('V35_PRODUCTION_BROWSER=PASS');
          ws.close();
          NODE
          node /tmp/v35-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-v35-zero-flicker-screenshots
          path: |
            /tmp/v35-zero-flicker.png
            /tmp/v35-production.png
          if-no-files-found: ignore
