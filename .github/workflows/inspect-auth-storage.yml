name: Patch CopyToLive Pages Premium Auth
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-auth-storage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve local Pages Premium during auth bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/dashboard-WZpp2Gui.js')
          s=p.read_text()
          old='Qs=async()=>{const e=Bs();if(!e)return null;try{const t=(await ws.get(`${qs}/me`,{headers:{Authorization:`Bearer ${e}`}})).data,a=Ws(t);return Vs(a),a}catch(t){return Hs(),localStorage.removeItem("session_user"),null}}'
          new='Qs=async()=>{const e=Bs();if(!e)return null;if("undefined"!=typeof location&&location.hostname==="copytolive.github.io"&&e==="pages-local-premium-v2"){try{const e=JSON.parse(localStorage.getItem("session_user")||"null");if(e&&e.isLoggedIn){const t={...e,isLoggedIn:!0,isPremium:!0,isPro:!0,status:"active",authProvider:"pages-local-premium",onboardingCompleted:!0};return Vs(t),t}}catch(t){}return null}try{const t=(await ws.get(`${qs}/me`,{headers:{Authorization:`Bearer ${e}`}})).data,a=Ws(t);return Vs(a),a}catch(t){return Hs(),localStorage.removeItem("session_user"),null}}'
          n=s.count(old)
          print('AUTH_BOOTSTRAP_MATCHES',n)
          if n!=1:
              raise SystemExit('expected exactly one auth bootstrap match')
          p.write_text(s.replace(old,new))
          PY
          node --check assets/js/dashboard-WZpp2Gui.js
          grep -q 'pages-local-premium-v2' assets/js/dashboard-WZpp2Gui.js
      - name: Commit patched production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name copytolive
          git config user.email copytolive@gmail.com
          git add assets/js/dashboard-WZpp2Gui.js
          git commit -m 'fix(pages): keep automatic premium session active'
          git push origin HEAD:main
