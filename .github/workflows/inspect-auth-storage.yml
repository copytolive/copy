name: Inspect CopyToLive Auth Storage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-auth-storage.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify browser CORS and Pro entitlement from GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/ctl-chrome about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          node - <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function main(){
            const targets = await fetch('http://127.0.0.1:9222/json/list').then(r=>r.json());
            const wsUrl = targets.find(t=>t.type==='page').webSocketDebuggerUrl;
            const ws = new WebSocket(wsUrl);
            await new Promise((resolve,reject)=>{ ws.addEventListener('open',resolve,{once:true}); ws.addEventListener('error',reject,{once:true}); });
            let id=0; const pending=new Map();
            ws.addEventListener('message', ev=>{ const m=JSON.parse(ev.data); if(m.id&&pending.has(m.id)){ const {resolve,reject}=pending.get(m.id); pending.delete(m.id); m.error?reject(new Error(JSON.stringify(m.error))):resolve(m.result); }});
            const send=(method,params={})=>new Promise((resolve,reject)=>{ const n=++id; pending.set(n,{resolve,reject}); ws.send(JSON.stringify({id:n,method,params})); });
            await send('Page.enable'); await send('Runtime.enable');
            await send('Page.navigate',{url:'https://copytolive.github.io/copy/?cors-premium-test='+Date.now()});
            await sleep(5000);
            const expr = `(async()=>{
              const API='https://copytolive.com/api';
              const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');
              const email='premium-browser-'+Date.now()+'-'+rnd()+'@copytolive.com';
              const password='Ctl!'+rnd()+rnd();
              try {
                const reg=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'CopyToLive Premium',email,password})});
                const regBody=await reg.json().catch(()=>({}));
                const token=regBody.accessToken||regBody.token||'';
                if(!reg.ok||!token) return {ok:false,stage:'register',http:reg.status,hasToken:!!token};
                const trial=await fetch(API+'/subscription/trial',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}});
                const statusRes=await fetch(API+'/subscription/status',{headers:{'Authorization':'Bearer '+token}});
                const meRes=await fetch(API+'/auth/me',{headers:{'Authorization':'Bearer '+token}});
                const st=await statusRes.json().catch(()=>({})); const mx=await meRes.json().catch(()=>({})); const u=mx.user||mx;
                const tier=st.tier||st.plan||st.subscription?.tier||''; const status=st.status||st.subscription?.status||'';
                const entitled=Boolean(u.isPro||u.isPremium||u.role==='admin'||u.role==='company'||(['PRO','PREMIUM','PROFIT_PARTNER'].includes(String(tier).toUpperCase())&&['ACTIVE','TRIAL'].includes(String(status).toUpperCase())));
                return {ok:reg.ok&&trial.ok&&statusRes.ok&&meRes.ok&&entitled,origin:location.origin,register:reg.status,trial:trial.status,statusHttp:statusRes.status,meHttp:meRes.status,tier,status,entitled};
              } catch(e) { return {ok:false,stage:'fetch',origin:location.origin,error:String(e)}; }
            })()`;
            const out=await send('Runtime.evaluate',{expression:expr,awaitPromise:true,returnByValue:true});
            const value=out.result?.value;
            console.log('BROWSER_PREMIUM_RESULT='+JSON.stringify(value));
            if(!value?.ok) process.exitCode=1;
            ws.close();
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
