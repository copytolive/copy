name: Inspect CopyToLive recovered routes

on:
  push:
    paths:
      - '.github/workflows/inspect-copy-routes.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Show route dispatch contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/js/index-DNfwXZJH.js')
          s=p.read_text(errors='ignore')
          needles=['location.pathname','window.location.pathname','"/trading"',"'/trading'",'pathname']
          shown=set()
          for needle in needles:
              print('\n===',needle,'===')
              pos=0; count=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  x=s[max(0,i-500):min(len(s),i+900)]
                  if x not in shown:
                      shown.add(x); print(x.replace('\n',' ')[:1400]); print()
                      count+=1
                  pos=i+len(needle)
                  if count>=20: break
          PY
