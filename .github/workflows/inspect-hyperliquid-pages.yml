name: Inspect Hyperliquid Pages Routing
on:
  push:
    paths:
      - '.github/workflows/inspect-hyperliquid-pages.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect route strings and root-relative references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [Path('assets/js/index-DNfwXZJH.js'), Path('compounding_live.html'), Path('dashboard/index.html')]
          needles = ['compounding_live','Hyperliquid','dashboard/index','/dashboard','pages_','renkoFrame','marketFrame','iframe','Start Trading','Emergency Close All']
          for p in files:
              if not p.exists(): continue
              s=p.read_text(errors='replace')
              print(f'=== {p} bytes={len(s)} ===')
              for n in needles:
                  print(f'--- NEEDLE {n!r} count={s.count(n)} ---')
                  start=0
                  for i in range(min(s.count(n), 12)):
                      j=s.find(n,start)
                      if j<0: break
                      print(s[max(0,j-350):min(len(s),j+700)].replace('\n',' '))
                      start=j+len(n)
              refs=sorted(set(re.findall(r'["\'`](/(?:compounding|dashboard|pages_|dynamic|supabase|assets)[^"\'` <>]*)', s)))
              print('ROOT_REFS', len(refs))
              for r in refs[:300]: print(r)
          PY
