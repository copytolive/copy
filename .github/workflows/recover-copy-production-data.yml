name: Recover CopyToLive production Backtest data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-copy-production-data.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe public production dataset paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/probes

          probe() {
            local name="$1"
            local url="$2"
            local tmp="recovered/probes/${name}.tmp"
            local hdr="recovered/probes/${name}.headers.txt"
            echo "PROBE $url"
            if curl -L --fail --silent --show-error --connect-timeout 15 --max-time 90 -D "$hdr" -o "$tmp" "$url"; then
              if python3 -c 'import json,os,sys; p=sys.argv[1]; assert os.path.getsize(p)>=100; json.load(open(p,"rb")); print("VALID_JSON",os.path.getsize(p))' "$tmp"; then
                mv "$tmp" "recovered/${name}.json"
                echo "FOUND ${name} $url"
              else
                rm -f "$tmp"
                echo "REJECT non-JSON/too-small: $url"
              fi
            else
              rm -f "$tmp"
              echo "MISS $url"
            fi
          }

          probe backtest_farm_1 https://copytolive.com/data/backtest_farm_1.json
          probe backtest_farm_2 https://copytolive.com/data/backtest_farm_2.json
          probe backtest_farm_monolith https://copytolive.com/data/backtest_farm.json
          probe root_backtest_farm_1 https://copytolive.com/backtest_farm_1.json
          probe root_backtest_farm_2 https://copytolive.com/backtest_farm_2.json
          probe root_backtest_farm https://copytolive.com/backtest_farm.json
          probe locked_backtest_farm https://copytolive.com/production_locked/650_locked/backtest_farm.json
          probe backtest_summary https://copytolive.com/data/backtest_summary.json
          probe backtest_local https://copytolive.com/data/backtest_local.json

          test -f recovered/backtest_farm_monolith.json
          python3 -c 'import json; d=json.load(open("recovered/backtest_farm_monolith.json")); assert isinstance(d,list) and len(d)==118, len(d); print("FARM_OK",len(d))'

      - name: Restore production datasets in Pages layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 -c 'import json,pathlib,shutil; src=pathlib.Path("recovered/backtest_farm_monolith.json"); rows=json.load(src.open()); assert len(rows)==118; mid=(len(rows)+1)//2; out=pathlib.Path("data"); (out/"backtest_farm_1.json").write_text(json.dumps(rows[:mid],ensure_ascii=False,separators=(",",":"))+"\n"); (out/"backtest_farm_2.json").write_text(json.dumps(rows[mid:],ensure_ascii=False,separators=(",",":"))+"\n"); shutil.copy2(src,out/"backtest_farm.json"); [shutil.copy2(pathlib.Path("recovered")/n,out/n) for n in ("backtest_summary.json","backtest_local.json") if (pathlib.Path("recovered")/n).exists()]'
          python3 -c 'import json; a=json.load(open("data/backtest_farm_1.json")); b=json.load(open("data/backtest_farm_2.json")); assert len(a)+len(b)==118; assert a[0]["totalTrades"]==319 and round(a[0]["profitFactor"],2)==1.84; print("SPLIT_OK",len(a),len(b),a[0]["title"])'
          ls -lh data/backtest*.json

      - name: Commit recovered production data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'copytolive-recovery-bot'
          git config user.email 'copytolive-recovery-bot@users.noreply.github.com'
          git add data/backtest_farm.json data/backtest_farm_1.json data/backtest_farm_2.json
          test ! -f data/backtest_summary.json || git add data/backtest_summary.json
          test ! -f data/backtest_local.json || git add data/backtest_local.json
          if git diff --cached --quiet; then
            echo 'Dataset already restored; no commit needed.'
          else
            git commit -m 'fix(pages): restore production Backtest datasets'
            git push origin HEAD:main
          fi

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: copy-production-backtest-recovery
          path: recovered/
          if-no-files-found: error
          retention-days: 3
