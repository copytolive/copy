name: Recover CopyToLive production static build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-production-static.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Restore healthy production root HTML for /copy/
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --connect-timeout 15 --max-time 120 https://copytolive.com/ -o /tmp/index-production.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/index-production.html').read_text()
          replacements={
            'href="/favicon.ico"':'href="/copy/favicon.ico"',
            'href="/favicon-32x32.png"':'href="/copy/favicon-32x32.png"',
            'href="/favicon-16x16.png"':'href="/copy/favicon-16x16.png"',
            'href="/apple-touch-icon.png"':'href="/copy/apple-touch-icon.png"',
            'href="/manifest.json"':'href="/copy/manifest.json"',
            'src="/assets/':'src="/copy/assets/',
            'href="/assets/':'href="/copy/assets/',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          required=[
            '/copy/assets/js/index-DNfwXZJH.js',
            '/copy/assets/js/vendor-rXCDSp0G.js',
            '/copy/assets/js/trading-BeRNyRbU.js',
            '/copy/assets/css/index-Dam86hTI.css',
            '<div id="root"></div>'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'Missing expected production markers: {missing}')
          Path('index.html').write_text(s)
          print('RESTORED_INDEX_BYTES',len(s.encode()))
          PY

          for f in \
            assets/js/index-DNfwXZJH.js \
            assets/js/dashboard-WZpp2Gui.js \
            assets/js/vendor-rXCDSp0G.js \
            assets/js/market-DD_HSfzQ.js \
            assets/js/charting-C4jAt7iT.js \
            assets/js/trading-BeRNyRbU.js \
            assets/css/index-Dam86hTI.css; do
            test -s "$f" || { echo "Missing production asset already expected in repo: $f" >&2; exit 21; }
          done

      - name: Commit restored production root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'copytolive-recovery-bot'
          git config user.email 'copytolive-recovery-bot@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Production root already restored.'
          else
            git commit -m 'fix(pages): use healthy production CopyToLive bundle'
            git push origin HEAD:main
          fi
