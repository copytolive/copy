name: Test trade history stability
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-history-ui.yml'
      - 'history_stability.js'
      - 'pages_root_bridge.js'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for deployed history stability v2
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 48); do
            if curl -LfsS 'https://copytolive.github.io/copy/history_stability.js?v=history-v2' -o /tmp/history.js \
              && grep -q 'version: 2' /tmp/history.js \
              && curl -LfsS 'https://copytolive.github.io/copy/pages_root_bridge.js?v=history-v2' -o /tmp/bridge.js \
              && grep -q "historyControls: 'stable-v2'" /tmp/bridge.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'HISTORY_STABILITY_DEPLOYED=PASS'

      - name: Browser click and transient-empty acceptance
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --window-size=2048,1180 --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank \
            >/tmp/chrome.out 2>/tmp/chrome.err &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json && break || sleep .5; done
          cat >/tmp/history-test.mjs <<'NODE'
          import fs from 'node:fs';
          const ROOT='https://copytolive.github.io/copy/';
          const pages=JSON.parse(fs.readFileSync('/tmp/pages.json','utf8'));
          const target=pages.find(x=>x.type==='page');
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          let seq=0;const pending=new Map();
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);}};
          await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});await send('Runtime.enable');await send('Page.enable');
          await send('Page.navigate',{url:ROOT});await new Promise(r=>setTimeout(r,1800));
          await send('Runtime.evaluate',{expression:`localStorage.setItem('ot_backtest_view_mode','live-trading');location.reload();true`,returnByValue:true});
          await new Promise(r=>setTimeout(r,18000));

          const seed=`(()=>{const f=document.getElementById('ctlSequentialCompoundingRoot');const w=f?.contentWindow,d=f?.contentDocument;if(!w||!d)throw new Error('frame missing');const ctl=w.__CTL_HISTORY_STABLE__;if(!ctl?.ready)throw new Error('history controller missing');const fills=[
            {trade_id:'t1',timestamp:'2026-08-27T03:00:00Z',symbol:'ATOM',type:'SELL',direction:'SHORT',volume:9.43,price:1.4834,pnl:null,is_entry:true},
            {trade_id:'t2',timestamp:'2026-08-27T03:05:00Z',symbol:'ATOM',type:'SELL',direction:'SHORT',volume:9.43,price:1.5018,pnl:-0.1735,is_entry:false},
            {trade_id:'t3',timestamp:'2026-08-27T03:06:00Z',symbol:'XLM',type:'BUY',direction:'LONG',volume:14,price:.19161,pnl:.0577,is_entry:true}
          ];const pend=[{order_id:'p1',created_at:'2026-08-27T03:07:00Z',symbol:'SOL',direction:'LONG',lot:.1,trigger_price:93.03}];w._allFillsForLog=fills.slice();w._tradeLogAllFills=fills.slice();w._allPending=pend.slice();ctl.fills=fills.slice();ctl.pending=pend.slice();ctl.setMode('all');const panel=d.getElementById('backtestHistoryPanel');w.scrollTo(0,Math.max(0,panel.offsetTop-90));return true})()`;
          await send('Runtime.evaluate',{expression:seed,returnByValue:true});await new Promise(r=>setTimeout(r,500));

          async function state(){const x=await send('Runtime.evaluate',{expression:`(()=>{const f=document.getElementById('ctlSequentialCompoundingRoot');const d=f?.contentDocument,w=f?.contentWindow;const a=d?.querySelector('.history-type-filter.active');return JSON.stringify({mode:w?._historyTypeFilter,ctl:w?.__CTL_HISTORY_STABLE__?{ready:w.__CTL_HISTORY_STABLE__.ready,version:w.__CTL_HISTORY_STABLE__.version,clicks:w.__CTL_HISTORY_STABLE__.clickCount}:null,active:a?.dataset?.historyType||'',rows:d?.getElementById('historyTableBody')?.children?.length||0,info:d?.getElementById('tradeLogInfo')?.textContent||''})})()`,returnByValue:true});return JSON.parse(x.result.value)}
          async function physicalClick(mode){const g=await send('Runtime.evaluate',{expression:`(()=>{const f=document.getElementById('ctlSequentialCompoundingRoot');const d=f?.contentDocument;const b=d?.querySelector('[data-history-type="${mode}"]');const fr=f?.getBoundingClientRect(),br=b?.getBoundingClientRect();return JSON.stringify({x:(fr?.left||0)+(br?.left||0)+(br?.width||0)/2,y:(fr?.top||0)+(br?.top||0)+(br?.height||0)/2})})()`,returnByValue:true});const p=JSON.parse(g.result.value);await send('Input.dispatchMouseEvent',{type:'mousePressed',x:p.x,y:p.y,button:'left',clickCount:1});await send('Input.dispatchMouseEvent',{type:'mouseReleased',x:p.x,y:p.y,button:'left',clickCount:1});await new Promise(r=>setTimeout(r,350));return state();}

          let s=await state();console.log('ALL_INITIAL',s);if(s.mode!=='all'||s.rows!==3)throw new Error('ALL seed render failed '+JSON.stringify(s));
          s=await physicalClick('direct');console.log('DIRECT_CLICK',s);if(s.mode!=='direct'||s.active!=='direct'||s.rows!==2||!s.info.includes('2 hasil'))throw new Error('DIRECT click/filter failed '+JSON.stringify(s));
          s=await physicalClick('pending');console.log('PENDING_CLICK',s);if(s.mode!=='pending'||s.active!=='pending'||s.rows!==1||!s.info.includes('1 hasil'))throw new Error('PENDING click/filter failed '+JSON.stringify(s));
          s=await physicalClick('all');console.log('ALL_CLICK',s);if(s.mode!=='all'||s.active!=='all'||s.rows!==3)throw new Error('ALL click restore failed '+JSON.stringify(s));

          await send('Runtime.evaluate',{expression:`(()=>{const f=document.getElementById('ctlSequentialCompoundingRoot');const d=f.contentDocument,w=f.contentWindow;w._allFillsForLog=[];w._tradeLogAllFills=[];d.getElementById('historyTableBody').innerHTML='';w.__CTL_HISTORY_STABLE__.sync('synthetic-transient-empty');return true})()`,returnByValue:true});
          await new Promise(r=>setTimeout(r,600));s=await state();console.log('TRANSIENT_EMPTY_RECOVERY',s);if(s.mode!=='all'||s.rows!==3)throw new Error('Transient empty recovery failed '+JSON.stringify(s));
          console.log('HISTORY_FILTER_ACCEPTANCE=PASS');ws.close();
          NODE
          node /tmp/history-test.mjs
