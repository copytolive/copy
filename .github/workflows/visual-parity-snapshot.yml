name: Capture CopyToLive Pages visual parity snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/visual-parity-snapshot.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Assert live Backtest dashboard with real browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank \
            >/tmp/chrome.out 2>/tmp/chrome.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json && break || sleep .5; done

          cat >/tmp/cdp.mjs <<'NODE'
          import fs from 'node:fs';
          const pages=JSON.parse(fs.readFileSync('/tmp/pages.json','utf8'));
          const target=pages.find(x=>x.type==='page');
          if(!target?.webSocketDebuggerUrl) throw new Error('No CDP target');
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          let seq=0; const pending=new Map(); const exceptions=[]; const failures=[];
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return;}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params.exceptionDetails);if(m.method==='Network.loadingFailed')failures.push(m.params);};
          await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          await send('Runtime.enable'); await send('Page.enable'); await send('Network.enable');
          await send('Page.navigate',{url:'https://copytolive.github.io/copy/?verify=backtest-parity-final'});
          await new Promise(r=>setTimeout(r,18000));
          const x=await send('Runtime.evaluate',{expression:`JSON.stringify({href:location.href,title:document.title,rootLength:document.getElementById('root')?.innerHTML.length||0,text:document.getElementById('root')?.innerText||''})`,returnByValue:true});
          const state=JSON.parse(x.result.value);
          fs.writeFileSync('browser-diagnostics.json',JSON.stringify({state,exceptions,failures},null,2));
          console.log('ROOT_LENGTH',state.rootLength);
          console.log('ROOT_TEXT_HEAD',state.text.slice(0,2500));
          for(const e of exceptions) console.log('EXCEPTION',e.text,e.exception?.description||'',e.url||'');
          for(const f of failures) console.log('NETFAIL',f.errorText,f.type,f.blockedReason||'');
          const required=['100/118','Profit Factor','Win Rate','Risk Reward','ND MTF LINREG_SLP — GOLD','31517'];
          for(const marker of required){if(!state.text.includes(marker)) throw new Error(`Missing Backtest marker: ${marker}`);}
          if(state.rootLength<100000) throw new Error(`Backtest root unexpectedly small: ${state.rootLength}`);
          if(exceptions.length) throw new Error(`Browser exceptions: ${exceptions.length}`);
          console.log('BACKTEST_VISUAL_PARITY=PASS');
          ws.close();
          NODE
          node /tmp/cdp.mjs | tee browser-diagnostics.txt

      - name: Capture final live viewport
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars \
            --window-size=2048,1180 --virtual-time-budget=18000 \
            --screenshot=copy-pages-live.png 'https://copytolive.github.io/copy/?visual=backtest-final'
          test -s copy-pages-live.png
          file copy-pages-live.png

      - uses: actions/upload-artifact@v4
        with:
          name: copy-pages-live-visual
          path: |
            copy-pages-live.png
            browser-diagnostics.json
            browser-diagnostics.txt
          if-no-files-found: error
          retention-days: 2
